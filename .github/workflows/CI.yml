name: Build and Test

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  NODE_ENV: ${{ vars.NODE_ENV }}
  PORT: ${{ vars.PORT }}
  DATABASE: ${{ secrets.DATABASE }}
  AUTH_URL: ${{ vars.AUTH_URL }}
  AUTH_TIMEOUT_MS: ${{ vars.AUTH_TIMEOUT_MS }}
  RATELIMIT_MAXCONNECTIONS: ${{ vars.RATELIMIT_MAXCONNECTIONS }}
  RATELIMIT_WINDOWMS: ${{ vars.RATELIMIT_WINDOWMS }}
  CORS_WHITELIST: ${{ vars.CORS_WHITELIST }}
  DEFAULT_PERPAGE: ${{ vars.DEFAULT_PERPAGE }}
  MAX_PERPAGE: ${{ vars.MAX_PERPAGE }}
  IMPORT_MAX_SIZE_MB: ${{ vars.IMPORT_MAX_SIZE_MB }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/Lithium'
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: |
          pnpm start &
          sleep 10
      - run: curl http://localhost:${{ env.PORT }}/healthcheck | grep running
